name: build

on:
  push:
    tags: ['v*', 'dsh-v*']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 'DSH npm version or dist-tag to bundle'
        required: false
        default: 'latest'
      publish_release:
        description: 'Publish a GitHub Release after building'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dsh-desktop-release-${{ github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      dsh_version: ${{ steps.release.outputs.dsh_version }}
      publish_release: ${{ steps.release.outputs.publish_release }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      should_build: ${{ steps.release.outputs.should_build }}

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve the official DSH release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.dsh_version || 'latest' }}
          PUBLISH_INPUT: ${{ inputs.publish_release || 'false' }}
        run: |
          requested="$REQUESTED_VERSION"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" == dsh-v* ]]; then
            requested="${GITHUB_REF_NAME#dsh-v}"
          fi

          dsh_version="$(npm view "@deepseek-ai/dsh@$requested" version)"
          release_tag="dsh-v$dsh_version"
          publish_release=false
          should_build=true

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            release_tag="$GITHUB_REF_NAME"
            publish_release=true
          elif [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            publish_release=true
            if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              should_build=false
              echo "DSH $dsh_version is already published as $release_tag"
            fi
          elif [[ "$PUBLISH_INPUT" == "true" ]]; then
            publish_release=true
          fi

          echo "dsh_version=$dsh_version" >> "$GITHUB_OUTPUT"
          echo "publish_release=$publish_release" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "Bundling official DSH $dsh_version"

  build:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            platform: windows
            arch: x64
            build_args: --win nsis portable --x64
            artifact_glob: dist/*.exe
          - name: macOS Apple Silicon
            runner: macos-15
            platform: macos
            arch: arm64
            build_args: --mac dmg --arm64
            artifact_glob: dist/*.dmg
          - name: macOS Intel
            runner: macos-15-intel
            platform: macos
            arch: x64
            build_args: --mac dmg --x64
            artifact_glob: dist/*.dmg
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install desktop dependencies
        run: npm ci

      - name: Install official DSH runtime
        shell: bash
        env:
          DSH_VERSION: ${{ needs.prepare.outputs.dsh_version }}
        run: npm install --prefix dsh-source "@deepseek-ai/dsh@$DSH_VERSION" --no-audit --no-fund

      - name: Use the bundled DSH version for artifact names
        shell: bash
        env:
          DSH_VERSION: ${{ needs.prepare.outputs.dsh_version }}
        run: npm version "$DSH_VERSION" --no-git-tag-version --allow-same-version

      - name: Stage platform-native runtime
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-source
        run: npm run stage

      - name: Build distributables
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.build_args }} --publish never

      - name: Audit release artifacts
        run: npm run audit

      - name: Compute checksums
        env:
          DSH_ARTIFACT_PLATFORM: ${{ matrix.platform }}
          DSH_ARTIFACT_ARCH: ${{ matrix.arch }}
        run: npm run checksums

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ matrix.artifact_glob }}
            dist/SHA256SUMS-${{ matrix.platform }}-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish_release == 'true' && needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dsh-desktop-*
          path: release-assets
          merge-multiple: true

      - name: Combine checksums
        shell: bash
        run: |
          : > release-assets/SHA256SUMS.txt
          for checksum in release-assets/SHA256SUMS-*.txt; do
            cat "$checksum" >> release-assets/SHA256SUMS.txt
          done
          cat release-assets/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          files: |
            release-assets/*.exe
            release-assets/*.dmg
            release-assets/SHA256SUMS.txt
          body: |
            Unofficial Windows and macOS desktop builds of DeepSeek Harness.

            Bundles official DSH `${{ needs.prepare.outputs.dsh_version }}` with
            a platform-native Node runtime. No Node or pnpm installation is
            required on the target machine.

            - Windows x64: installer and portable executable
            - macOS arm64: Apple Silicon DMG
            - macOS x64: Intel DMG

            Windows builds are unsigned. macOS builds are ad-hoc signed but not
            notarized. SmartScreen and Gatekeeper will warn or block the first
            launch. Verify the download against `SHA256SUMS.txt` before opening it.

            Not affiliated with or endorsed by DeepSeek.
