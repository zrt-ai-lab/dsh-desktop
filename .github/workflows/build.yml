name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 'DSH version to bundle (npm dist-tag or exact version)'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install shell dependencies
        run: npm ci

      # A CI runner has no npx cache to stage from, so the DSH release is
      # installed into a throwaway directory and handed to the stage script
      # through DSH_SOURCE_ROOT.
      - name: Install DSH release to stage from
        shell: pwsh
        run: |
          $version = '${{ github.event.inputs.dsh_version }}'
          if ([string]::IsNullOrWhiteSpace($version)) { $version = 'latest' }
          New-Item -ItemType Directory -Force -Path dsh-source | Out-Null
          Push-Location dsh-source
          npm init -y | Out-Null
          npm install "@deepseek-ai/dsh@$version" --no-audit --no-fund
          Pop-Location
          $staged = (Get-Content 'dsh-source/node_modules/@deepseek-ai/dsh/package.json' -Raw | ConvertFrom-Json).version
          "DSH_STAGED_VERSION=$staged" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "Bundling DSH $staged"

      - name: Stage runtime
        shell: pwsh
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}\dsh-source
        run: npm run stage

      - name: Build installers
        shell: pwsh
        env:
          # Unsigned builds: stop electron-builder from hunting for a certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        # `--publish never` because electron-builder otherwise infers a publish
        # target from the repository and demands GH_TOKEN. Releasing is the
        # dedicated step's job, not the packer's.
        run: npx electron-builder --win nsis portable --publish never

      # The audit is a release gate, not a formality: it fails the build if user
      # data, credentials, or build-machine paths reached the artifacts.
      - name: Audit release artifacts
        run: npm run audit

      - name: Compute checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$h  $($_.Name)"
          } | Tee-Object -FilePath dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-windows
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
          body: |
            Windows desktop build of DeepSeek Harness.

            Bundles DSH `${{ env.DSH_STAGED_VERSION }}` with its own Node runtime —
            no Node, pnpm, or other prerequisites needed on the target machine.

            **These builds are unsigned.** SmartScreen will warn on first run;
            choose *More info -> Run anyway*. Verify the download against
            `SHA256SUMS.txt` before installing.

            Not affiliated with or endorsed by DeepSeek.
